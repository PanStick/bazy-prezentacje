services:
  spark-jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: delta_lake_lab
    ports:
      - "8888:8888"  # Interfejs Jupyter Lab / Notebook
      - "4040:4040"  # Interfejs graficzny Spark UI (aktywny podczas działania zadań)
    volumes:
      - ./notebooks:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''
